# Local hooks so versions always match uv.lock / pnpm-lock.yaml.
# Install with: uv run pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: prettier
        name: prettier (web)
        entry: corepack pnpm -C web exec prettier --write --ignore-unknown .
        language: system
        files: ^web/
        pass_filenames: false
      - id: eslint
        name: eslint (web)
        entry: corepack pnpm -C web lint
        language: system
        files: ^web/.*\.(ts|tsx|js)$
        pass_filenames: false
